<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07111f" />
    <title>Alphix — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #07111f;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .card {
        width: min(22rem, 92vw);
        text-align: center;
        padding: 1.5rem 1.25rem;
        border-radius: 14px;
        border: 1px solid #1e3a4f;
        background: #0b1624;
      }
      h1 {
        margin: 0;
        font-size: 1rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      p {
        margin: 0.75rem 0 1.25rem;
        font-size: 0.85rem;
        line-height: 1.45;
        color: #94a3b8;
      }
      button {
        min-height: 44px;
        min-width: 44px;
        padding: 0 1.1rem;
        border: 0;
        border-radius: 8px;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #04101a;
        background: linear-gradient(135deg, #22d3ee, #38bdf8);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Desk unreachable</h1>
      <p>
        Alphix needs a network connection to load the live NSE/BSE desk. Check
        Wi‑Fi or mobile data, then retry.
      </p>
      <button type="button" id="retry">Retry</button>
    </div>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        location.href = "./index.html";
      });
    </script>
  </body>
</html>
