<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07111f" />
    <title>Alphix Terminal</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: #07111f;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        display: grid;
        place-items: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .boot {
        text-align: center;
        padding: 1.5rem;
      }
      .mark {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        margin: 0 auto 1rem;
        background: #04101a;
        border: 1px solid color-mix(in srgb, #22d3ee 45%, transparent);
        display: grid;
        place-items: center;
        overflow: hidden;
      }
      .mark img {
        width: 72px;
        height: 72px;
        object-fit: cover;
      }
      h1 {
        margin: 0;
        font-size: 1.05rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      p {
        margin: 0.55rem 0 0;
        font-size: 0.78rem;
        color: #94a3b8;
        letter-spacing: 0.04em;
      }
      .pulse {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #22d3ee;
        margin: 1.25rem auto 0;
        box-shadow: 0 0 0 0 color-mix(in srgb, #22d3ee 55%, transparent);
        animation: ping 1.4s ease-out infinite;
      }
      @keyframes ping {
        0% {
          box-shadow: 0 0 0 0 color-mix(in srgb, #22d3ee 55%, transparent);
        }
        70% {
          box-shadow: 0 0 0 12px transparent;
        }
        100% {
          box-shadow: 0 0 0 0 transparent;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="boot">
      <div class="mark" aria-hidden="true">
        <img src="icon.png" alt="" width="72" height="72" />
      </div>
      <h1>Alphix Terminal</h1>
      <p>Connecting to live desk…</p>
      <div class="pulse" aria-hidden="true"></div>
    </div>
  </body>
</html>
