# Alphix / IROS Terminal — production compose stack
name: sigq
# Hub images (same on every machine): smohanty010620/iros-market-api, iros-frontend, cloudflared, iros-desk-state
# iros-desk-state is a JSON snapshot image (Hub has no volumes). Packed by push-docker-hub.bat.
#
# This PC (after code changes):  rebuild-docker.bat   then  push-docker-hub.bat
# Other PCs (pull only):         start-from-hub.bat
#   requires backend/.env and config/cloudflare/credentials.json (never in the image)
#   desk JSON is seeded from iros-desk-state (last push) into volumes BEFORE API start
#   pack copies /app/state + /app/backend/app/data + eod_archive (not a 6-file subset)
#
# Usage:
#   1. Ensure backend/.env exists (Angel + LLM secrets)
#   2. docker compose --profile tunnel pull && docker compose --profile tunnel up -d
#   3. Open http://localhost:3000

services:
  market-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: smohanty010620/iros-market-api:latest
    container_name: iros-market-api
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      MARKET_API_HOST: "0.0.0.0"
      MARKET_API_PORT: "8000"
      AI_NEWS_API_URL: "http://ai-news:8001"
      FRONTEND_URL: "http://localhost:3000"
      BACKEND_URL: "http://localhost:8000"
      HEALTH_PORT: "8000"
      TZ: Asia/Kolkata
      MARKET_PREWORK_ENABLED: "1"
      MARKET_PREWORK_HOUR: "9"
      MARKET_PREWORK_MINUTE: "45"
      MARKET_PREWORK_POOL: "Nifty 500"
      # Angel historical API is aggressively rate-limited (AB1021).
      # After AB1021, skip further getCandleData for ANGEL_CANDLE_CIRCUIT_SECONDS.
      INTRADAY_FETCH_WORKERS: "1"
      INTRADAY_MAX_DAILY_REPLACEMENTS: "15"
      INTRADAY_MAX_DAILY_POSITIONS: "20"
      CANDLE_MIN_INTERVAL_SECONDS: "1.1"
      CANDLE_RATE_LIMIT_RETRIES: "0"
      ANGEL_CANDLE_CIRCUIT_SECONDS: "120"
      # Complete-universe quotes: NSE primary, Dhan bulk, then Angel fallback.
      MARKET_DATA_MIN_COVERAGE_PCT: "99"
      MARKET_DATA_MIN_CANDLE_COVERAGE_PCT: "95"
      NIFTY_CACHE_EXPECTED_MIN: "475"
      NIFTY_CACHE_MIN_COVERAGE_PCT: "99"
      NIFTY_CACHE_MAX_AGE_SECONDS: "86400"
      DESK_AUTO_ENABLED: "1"
      DESK_AUTO_COMMIT: "1"
      DESK_COMMIT_DELAY_MIN: "0"
      DESK_LOCK_START: "09:45"
      DESK_LOCK_END: "10:15"
      DESK_LOCK_CATCHUP_UNTIL: "15:30"
      DESK_AUTO_MIDDAY_REFRESH: "1"
      DESK_MIDDAY_REFRESH_TIMES: "12:00,14:00"
      DESK_AUTO_PM_LLM: "1"
      DESK_PM_LLM_HOUR: "16"
      DESK_PM_LLM_MINUTE: "0"
      SWING_CAPITAL: "1000000"
      SWING_SESSION_FILE: /app/state/swing_session.json
      SNAPSHOT_FILE: /app/state/trade_api_snapshot.json
      MARKET_SNAPSHOT_FILE: /app/state/last_market_snapshot.json
      FIXED_PLAN_FILE: /app/state/fixed_trade_plan.json
      ALERT_HISTORY_FILE: /app/state/alert_history.json
      INTRADAY_SESSION_FILE: /app/state/intraday_session.json
      INDEX_OPTIONS_RADAR_FILE: /app/state/index_options_radar.json
      INDEX_OPTIONS_OI_BASELINE_FILE: /app/state/index_options_oi_baseline.json
      INDEX_OPTIONS_CANDLE_CACHE_FILE: /app/state/index_options_candles.json
      INDEX_OPTIONS_PAPER_BOOK_FILE: /app/state/index_options_paper_book.json
      INDEX_OPTIONS_STREAM_ENABLED: "1"
    ports:
      - "${SIGQ_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - iros-backend-data:/app/backend/app/data
      - iros-eod-archive:/app/backend/app/services/eod_archive
      # Docker volume keeps desk state durable across machines and container rebuilds.
      - iros-desk-state:/app/state
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      ai-news:
        condition: service_healthy

  ai-news:
    image: smohanty010620/iros-market-api:latest
    container_name: iros-ai-news
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      AI_NEWS_PORT: "8001"
      HEALTH_PORT: "8001"
      TZ: Asia/Kolkata
      SWING_SESSION_FILE: /app/state/swing_session.json
      SNAPSHOT_FILE: /app/state/trade_api_snapshot.json
      MARKET_SNAPSHOT_FILE: /app/state/last_market_snapshot.json
      FIXED_PLAN_FILE: /app/state/fixed_trade_plan.json
      ALERT_HISTORY_FILE: /app/state/alert_history.json
      INTRADAY_SESSION_FILE: /app/state/intraday_session.json
    command:
      [
        "uvicorn",
        "app.services.ai_news_server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
      ]
    ports:
      - "${SIGQ_BIND_ADDRESS:-127.0.0.1}:8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - iros-backend-data:/app/backend/app/data
      - iros-eod-archive:/app/backend/app/services/eod_archive
      - iros-desk-state:/app/state
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./iros-terminal
      dockerfile: Dockerfile
    image: smohanty010620/iros-frontend:latest
    container_name: iros-frontend
    restart: unless-stopped
    init: true
    environment:
      MARKET_API_URL: "http://market-api:8000"
      NEXT_PUBLIC_BACKEND_URL: "http://localhost:8000"
      NEXT_PUBLIC_MARKET_API_URL: ""
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      FRONTEND_WORKERS: "6"
      TZ: Asia/Kolkata
    ports:
      - "${SIGQ_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      market-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  # Desk JSON snapshot — not a running service. Built/pushed so other PCs can seed /app/state.
  desk-state:
    profiles: ["desk-state"]
    build:
      context: ./config/docker/desk-state
      dockerfile: Dockerfile
    image: smohanty010620/iros-desk-state:latest
    command: ["true"]

  # Private runtime bundle: backend/.env + Cloudflare credentials.json + live volume
  # snapshots. LIVE SECRETS LIVE HERE — this image must only ever be pushed to a
  # PRIVATE Hub repo (smohanty010620/sigq-runtime-private). See its Dockerfile.
  runtime-private:
    profiles: ["runtime-private"]
    build:
      context: ./config/docker/runtime-private
      dockerfile: Dockerfile
    image: smohanty010620/sigq-runtime-private:latest
    command: ["true"]

  # Cloudflare Tunnel — Hub image has `tunnel run` baked in (official image only prints version).
  # Credentials are mounted, never baked. Enabled via --profile tunnel.
  cloudflared:
    profiles: ["tunnel"]
    build:
      context: ./config/cloudflare
      dockerfile: Dockerfile
    image: smohanty010620/cloudflared:latest
    container_name: iros-cloudflared
    restart: unless-stopped
    init: true
    volumes:
      - ./config/cloudflare/config.docker.yml:/etc/cloudflared/config.yml:ro
      - ./config/cloudflare/credentials.json:/etc/cloudflared/credentials.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  iros-backend-data:
  iros-eod-archive:
  iros-desk-state:
