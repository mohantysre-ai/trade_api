name: Production load test 1000 concurrency

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-test-1000.yml'

permissions:
  contents: read

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LOAD_BASE_URL: https://sigq.in
      LOAD_REQUEST_TIMEOUT: '20'
      LOAD_CONNECT_TIMEOUT: '8'
      LOAD_MAX_ERROR_RATE: '0.02'
      LOAD_MAX_P95_MS: '2500'
      LOAD_MAX_P99_MS: '6000'
      LOAD_MIN_RPS_1000: '75'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Install load-test dependency
        run: python -m pip install aiohttp

      - name: Verify target
        run: |
          python - <<'PY'
          import urllib.request
          u='https://sigq.in/'
          r=urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent':'sigq-authorized-load-test/1.0'}), timeout=15)
          print('preflight_status=', r.status)
          print('server=', r.headers.get('server'))
          print('cf_ray=', r.headers.get('cf-ray'))
          PY

      - name: Run staged 50 to 1000 concurrent client test
        run: python performance/load_test_1000.py

      - name: Print report
        if: always()
        run: |
          if [ -f load-test-report.json ]; then cat load-test-report.json; fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigq-load-test-1000-report
          path: load-test-report.json
          if-no-files-found: warn
