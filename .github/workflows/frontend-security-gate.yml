name: Frontend container security gate

on:
  pull_request:
    paths:
      - 'iros-terminal/**'
      - '.github/workflows/frontend-security-gate.yml'
  push:
    branches: [main]
    paths:
      - 'iros-terminal/Dockerfile'
      - 'iros-terminal/package.json'
      - 'iros-terminal/package-lock.json'
      - 'iros-terminal/server-cluster.js'
      - '.github/workflows/frontend-security-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Production dependency audit
        working-directory: iros-terminal
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Production build
        working-directory: iros-terminal
        run: npm run build

      - name: Build frontend container
        run: docker build --pull -t iros-frontend:security-gate ./iros-terminal

      - name: Assert non-root runtime
        run: |
          test "$(docker run --rm --entrypoint id iros-frontend:security-gate -u)" != "0"
          docker run --rm --entrypoint node iros-frontend:security-gate --version

      - name: Block fixable HIGH and CRITICAL CVEs
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            iros-frontend:security-gate
