name: Frontend container security gate

on:
  pull_request:
    paths:
      - 'iros-terminal/**'
      - '.github/workflows/frontend-security-gate.yml'
  push:
    branches: [main]
    paths:
      - 'iros-terminal/Dockerfile'
      - 'iros-terminal/package.json'
      - 'iros-terminal/package-lock.json'
      - 'iros-terminal/server-cluster.js'
      - '.github/workflows/frontend-security-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Production dependency audit
        working-directory: iros-terminal
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Production build
        working-directory: iros-terminal
        run: npm run build

      - name: Build frontend container
        run: docker build --pull --no-cache -t iros-frontend:security-gate ./iros-terminal

      - name: Assert distroless non-root runtime
        run: |
          test "$(docker image inspect iros-frontend:security-gate --format '{{.Config.User}}')" = "65532:65532"
          docker run --rm --entrypoint /nodejs/bin/node iros-frontend:security-gate --version
          if docker run --rm --entrypoint /bin/sh iros-frontend:security-gate -c 'true' 2>/dev/null; then
            echo 'Runtime unexpectedly contains a shell'
            exit 1
          fi

      - name: Block all HIGH and CRITICAL CVEs
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            iros-frontend:security-gate
