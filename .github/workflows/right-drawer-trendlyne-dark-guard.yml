name: Right drawer Trendlyne readability guard

on:
  pull_request:
    paths:
      - 'iros-terminal/app/components/**'
      - '.github/workflows/right-drawer-trendlyne-dark-guard.yml'
  push:
    branches: [main]
    paths:
      - 'iros-terminal/app/components/**'
      - '.github/workflows/right-drawer-trendlyne-dark-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trendlyne-readability-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce readable Trendlyne widgets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('iros-terminal/app/components')
          violations = []
          widgets = []

          for path in root.rglob('*.tsx'):
              text = path.read_text(encoding='utf-8')
              if 'trendlyne.com' not in text and 'trendlyne-widgets' not in text:
                  continue

              widgets.append(str(path))

              if 'TRENDLYNE_DARK_FILTER' in text or 'forceTrendlyneIframeDark' in text:
                  violations.append(f'{path}: iframe color inversion/filter is forbidden')
              if re.search(r'iframe\.style\.filter\s*=', text):
                  violations.append(f'{path}: iframe filter is forbidden')

              # Trendlyne widget themes are not consistent across widget families.
              # Force the native light document for reliable text contrast and keep
              # our surrounding SIGQ shell responsible for app dark/light styling.
              if 'trendlyne-widgets' in text and not (
                  re.search(r'dataset\.theme\s*=\s*[\"\']light[\"\']', text)
                  or re.search(r'data-theme\s*=\s*[\"\']light[\"\']', text)
              ):
                  violations.append(f'{path}: Trendlyne embed must use native light theme for readability')

              if re.search(r'<iframe[\s\S]{0,500}(trendlyne\.com|src=\{widgetUrl\})', text, re.I):
                  violations.append(f'{path}: raw Trendlyne iframe is forbidden; use trendlyne-widgets bootstrap')

          print('Trendlyne component files:')
          for item in widgets:
              print(f' - {item}')

          if violations:
              print('\nViolations:')
              for violation in violations:
                  print(f' - {violation}')
              sys.exit(1)

          print('\nAll Trendlyne component embeds use readable native rendering.')
          PY

      - name: Production build
        working-directory: iros-terminal
        run: |
          npm ci
          npm run build
