name: Temporary full regression probe
on:
  push:
    branches: [intradayv2]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q --upgrade pip
      - run: python -m pip install -q -r requirements.txt pytest pytest-asyncio
      - name: Full backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iros-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: iros-terminal/package-lock.json
      - run: npm ci
      - name: Frontend units
        run: node --test lib/*.test.mjs
      - name: Frontend lint
        run: npm run lint
      - name: Frontend build
        run: npm run build
