name: Apply swing hunt pipeline fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-swing-hunt-fix.yml'
      - 'scripts/fix_swing_hunt_pipeline.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply swing hunt repair
        run: python3 scripts/fix_swing_hunt_pipeline.py

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run swing and market-data tests
        working-directory: backend
        run: pytest -q tests/test_swing_automation.py tests/test_market_data_provider.py

      - name: Compile patched Python
        run: |
          python -m py_compile backend/app/services/swing_session.py
          python -m py_compile backend/app/services/market_data_provider.py
          python -m py_compile backend/app/services/angel_one_feed.py

      - name: Commit validated fix to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/services/swing_session.py backend/app/services/market_data_provider.py backend/app/services/angel_one_feed.py backend/tests/test_swing_automation.py backend/tests/test_market_data_provider.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Fix continuous Angel-first swing hunt and auto paper fills'
          git push origin HEAD:main
